# .github/workflows/build-zygisk-module.yml
name: Build Zygisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: r25b    # atau sesuaikan dengan versi NDK yang dipakai
      ANDROID_PLATFORM: android-30 # minimal API level target
      ANDROID_ABI: arm64-v8a       # ABI target

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ env.ANDROID_NDK_VERSION }}

    - name: Build native library (.so)
      working-directory: jni
      run: |
        # jika pakai ndk-build
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk \
          APP_ABI=${{ env.ANDROID_ABI }} \
          APP_PLATFORM=${{ env.ANDROID_PLATFORM }}

        # atau bila pakai CMakeLists.txt, uncomment block ini:
        # mkdir -p build && cd build
        # cmake .. \
        #   -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
        #   -DANDROID_ABI=${{ env.ANDROID_ABI }} \
        #   -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }}
        # make -j$(nproc)

    - name: Package module into ZIP
      run: |
        # buat struktur modul sesuai format Zygisk
        rm -rf module
        mkdir -p module/zygisk/${{ env.ANDROID_ABI }}
        # copy .so hasil build
        cp jni/obj/local/${{ env.ANDROID_ABI }}/libFingerprintBypassModule.so \
           module/zygisk/${{ env.ANDROID_ABI }}/
        # copy config
        cp config.json module/
        # (jika ada file lain, copy juga)
        # e.g. cp module.prop module/

        # zip semua
        zip -r module.zip module

    - name: Upload module artifact
      uses: actions/upload-artifact@v2
      with:
        name: zygisk-fingerprint-bypass
        path: module.zip